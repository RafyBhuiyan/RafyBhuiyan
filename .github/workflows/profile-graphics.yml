name: Refresh profile graphics

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/profile_graphics.py'
      - 'scripts/profile_dashboard.py'
      - '.github/workflows/profile-graphics.yml'

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate profile graphics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/profile_graphics.py
      - name: Save updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/language-lion.svg images/github-activity.svg images/tech-stack.svg images/profile-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile graphics"
            git push
          fi

